<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameStore — Admin panel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #0f0f17; --bg-2: #1a1a2e; --card: #16162a; --primary: #7c3aed; --text: #fff; --text-2: #a0a0b8; --border: #2a2a44; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.header h1 { font-size: 22px; background: linear-gradient(135deg, var(--primary), #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.login-form { max-width: 320px; margin: 100px auto; text-align: center; }
.login-form h2 { margin-bottom: 20px; }
.login-form input { width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; margin-bottom: 12px; }
.login-form button { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary), #a855f7); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
.stat-card .num { font-size: 24px; font-weight: 800; }
.stat-card .label { font-size: 11px; color: var(--text-2); margin-top: 4px; }
.stat-card:nth-child(1) .num { color: var(--primary); }
.stat-card:nth-child(2) .num { color: var(--warning); }
.stat-card:nth-child(3) .num { color: var(--success); }
.stat-card:nth-child(4) .num { color: #06b6d4; }
.orders-list { display: flex; flex-direction: column; gap: 8px; }
.order-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.order-info { flex: 1; min-width: 200px; }
.order-info .product { font-weight: 600; font-size: 14px; }
.order-info .meta { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.order-status { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; }
.status-new { background: rgba(124,58,237,0.2); color: var(--primary); }
.status-paid { background: rgba(245,158,11,0.2); color: var(--warning); }
.status-done { background: rgba(16,185,129,0.2); color: var(--success); }
.status-cancelled { background: rgba(239,68,68,0.2); color: var(--danger); }
.order-actions { display: flex; gap: 6px; }
.order-actions button { padding: 6px 10px; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 500; }
.btn-paid { background: var(--warning); color: #000; }
.btn-done { background: var(--success); color: #fff; }
.btn-cancel { background: var(--danger); color: #fff; }
.hidden { display: none; }
@media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎮 GameStore Admin</h1>
    <button id="logoutBtn" class="hidden" onclick="logout()" style="background:var(--danger);border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;">Chiqish</button>
  </div>
  <div id="loginForm" class="login-form">
    <h2>🔐 Admin panel</h2>
    <input type="password" id="adminToken" placeholder="Admin parol">
    <button onclick="login()">Kirish</button>
  </div>
  <div id="dashboard" class="hidden">
    <div class="stats-grid" id="statsGrid"></div>
    <h3 style="margin-bottom:12px;font-size:16px;">📋 Buyurtmalar</h3>
    <div class="orders-list" id="ordersList"><p style="color:var(--text-2);text-align:center;padding:40px;">Yuklanmoqda...</p></div>
  </div>
</div>
<script>
const API = window.location.origin;
let loggedIn = false;
async function login() {
  const token = document.getElementById('adminToken').value;
  const res = await fetch(API + '/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
  const data = await res.json();
  if (data.ok) { loggedIn = true; localStorage.setItem('adminToken', token); document.getElementById('loginForm').classList.add('hidden'); document.getElementById('dashboard').classList.remove('hidden'); document.getElementById('logoutBtn').classList.remove('hidden'); loadDashboard(); } else { alert("Noto'g'ri parol!"); }
}
function logout() { loggedIn = false; localStorage.removeItem('adminToken'); document.getElementById('loginForm').classList.remove('hidden'); document.getElementById('dashboard').classList.add('hidden'); document.getElementById('logoutBtn').classList.add('hidden'); }
async function loadDashboard() {
  const statsRes = await fetch(API + '/api/admin/stats');
  const statsData = await statsRes.json();
  if (statsData.ok) {
    const s = statsData.stats;
    document.getElementById('statsGrid').innerHTML = '<div class="stat-card"><div class="num">' + s.total + '</div><div class="label">Jami</div></div><div class="stat-card"><div class="num">' + s.new + '</div><div class="label">Yangi</div></div><div class="stat-card"><div class="num">' + s.done + '</div><div class="label">Bajarilgan</div></div><div class="stat-card"><div class="num">' + formatPrice(s.revenue) + '</div><div class="label">Daromad (so\'m)</div></div>';
  }
  const ordersRes = await fetch(API + '/api/admin/orders');
  const ordersData = await ordersRes.json();
  if (ordersData.ok) {
    const orders = ordersData.orders;
    if (orders.length === 0) { document.getElementById('ordersList').innerHTML = '<p style="color:var(--text-2);text-align:center;padding:40px;">Hali buyurtma yo\'q</p>'; return; }
    const statusLabels = { new: 'Yangi', paid: "To'landi", done: 'Bajarildi', cancelled: 'Bekor qilindi' };
    document.getElementById('ordersList').innerHTML = orders.map(o => {
      const date = new Date(o.createdAt).toLocaleString('uz-UZ');
      let actions = '';
      if (o.status === 'new') actions += '<button class="btn-paid" onclick="updateStatus(\'' + o.id + '\',\'paid\')">To\'landi</button>';
      if (o.status === 'paid') actions += '<button class="btn-done" onclick="updateStatus(\'' + o.id + '\',\'done\')">✅ Bajarildi</button>';
      if (o.status !== 'cancelled' && o.status !== 'done') actions += '<button class="btn-cancel" onclick="updateStatus(\'' + o.id + '\',\'cancelled\')">✕</button>';
      return '<div class="order-card"><div class="order-info"><div class="product">' + o.product.icon + ' ' + o.product.name + '</div><div class="meta">' + o.playerId + ' | ' + formatPrice(o.product.price) + ' so\'m | ' + o.payment + ' | ' + date + '</div></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span class="order-status status-' + o.status + '">' + (statusLabels[o.status] || o.status) + '</span><div class="order-actions">' + actions + '</div></div></div>';
    }).join('');
  }
}
async function updateStatus(id, status) { const res = await fetch(API + '/api/admin/order/' + id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) }); const data = await res.json(); if (data.ok) loadDashboard(); }
function formatPrice(p) { return p.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
const savedToken = localStorage.getItem('adminToken');
if (savedToken) { document.getElementById('adminToken').value = savedToken; login(); }
setInterval(() => { if (loggedIn) loadDashboard(); }, 30000);
</script>
</body>
</html>
